<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="FFXIV,時尚品鑑,詞條工具,Final Fantasy XIV,Fashion Check,Tool"/>
    <meta name="description" content="FFXIV 時尚品鑑詞條工具"/>
    <title>FFXIV 時尚品鑑詞條工具</title>
    <link rel="canonical" href="https://dsa83171.github.io/FFXIV-Fashion-check-Tool/">
    <link rel="shortcut icon" href="assets/images/ffxiv.ico" type="image/x-icon"/>
    <link href="assets/images/favicon.png" rel="shortcut icon"/>
    <script type="module" src="assets/js/main.js?v=1.0"></script>
    <script src="assets/js/vue.global.js"></script>
    <script src="assets/js/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app" class="min-h-screen bg-[#33333d] py-6 px-4 text-[#e0e0e0] font-sans">
        <div class="max-w-6xl mx-auto">
            
            <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-[#444452] pb-6">
                <div class="flex-1 w-full md:w-auto">
                    <!--標題-->
                    <h1 class="text-2xl font-bold text-white flex items-center tracking-tight">
                        <span class="text-[#4db6ac] mr-2">◈</span> FFXIV 時尚品鑑詞條工具
                    </h1>
                    <!--期數選單與全域搜尋-->
                    <div class="mt-4 flex flex-wrap items-center gap-3">
                        <!--期數下拉選單-->
                        <div class="relative">
                            <select 
                                v-model="selectedWeeklyKey" 
                                @change="applyWeekly"
                                class="bg-[#2a2a35] border border-[#444452] text-white rounded px-3 py-1.5 text-sm outline-none focus:border-[#4db6ac] appearance-none cursor-pointer shadow-md min-w-[140px]"
                            >
                                <option value="" class="text-[#a5a5b1]">-- 選擇期數 --</option>
                                <option v-for="key in sortedWeeklyKeys" :key="key" :value="key" class="text-white">
                                    第 {{ key }} 期
                                </option>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#666] text-[10px]">▼</div>
                        </div>

                        <div v-if="selectedWeeklyKey" class="flex items-center bg-[#2a2a35] text-[#8799ED] px-3 py-1.5 rounded border border-[#444452] shadow-sm">
                            <span class="text-m font-bold mr-2 uppercase opacity-70 tracking-wider">主題:</span>
                            <span class="text-m font-bold">{{ weeklyData[selectedWeeklyKey].主題 }}</span>
                        </div>

                        <!--全域搜尋輸入框-->
                        <div class="relative flex-1 min-w-[200px] max-w-sm ml-0 md:ml-4">
                            <input 
                                type="text" 
                                v-model="globalSearch"
                                class="w-full bg-[#1e1e26] text-white text-sm border border-[#4db6ac]/30 focus:border-[#4db6ac] rounded px-8 py-1.5 outline-none transition-all placeholder:text-[#555566]"
                                placeholder="反向搜尋裝備關鍵字..."
                            />
                            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-[#4db6ac] text-xs">🔍</span>
                            <button v-show="globalSearch" @click="globalSearch = ''" class="absolute right-2 top-1/2 -translate-y-1/2 text-[#777888] hover:text-white">&times;</button>
                        </div>
                    </div>
                </div>
                <!--重置按鈕-->
                <button @click="clearAll" class="bg-[#2a2a35] border border-[#444452] text-[#a5a5b1] hover:text-[#ff5252] hover:border-[#ff5252]/30 px-4 py-2 rounded text-sm transition-all shadow-sm flex items-center gap-2">
                    <span>✕</span> <span>重置所有部件</span>
                </button>
            </header>

            <!--部位選單與顯示區-->
            <div v-if="Object.keys(parts).length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                <div v-for="conf in partConfigs" :key="conf.key" 
                     class="bg-[#3c3c4c] p-4 rounded border border-[#444452] flex flex-col hover:border-[#555566] transition-all shadow-lg"
                     :class="globalMatchedResults(conf.key).length > 0 ? 'ring-1 ring-[#4db6ac]/50 border-[#4db6ac]/50' : ''">
                    
                    <h2 class="text-sm font-bold text-white mb-3 uppercase tracking-widest flex justify-between items-center">
                        {{ conf.label }}
                        <span class="text-[#555566] text-[10px]">Slot</span>
                    </h2>
                    <!-- 搜尋輸入框與下拉選單 -->
                    <div class="relative mb-3">
                        <input 
                            type="text" 
                            v-model="parts[conf.key].search"
                            @focus="parts[conf.key].isOpen = true"
                            class="w-full bg-[#2a2a35] text-[#4db6ac] font-bold text-sm border border-[#444452] focus:border-[#4db6ac] rounded px-2 py-2 outline-none transition-colors placeholder:text-[#777888]"
                            placeholder="搜尋詞條..."
                        />
                        <button v-show="parts[conf.key].search" @click="clearSingle(conf.key)" class="absolute right-2 top-1/2 -translate-y-1/2 text-[#C2C2C2] hover:text-red-400 text-lg">&times;</button>
                        
                        <ul v-show="parts[conf.key].isOpen" class="absolute z-20 w-full mt-1 max-h-60 overflow-y-auto bg-[#2a2a35] border border-[#444452] shadow-2xl rounded">
                            <li v-for="(v, k) in filteredOptions(conf.key)" :key="k" @mousedown="selectItem(conf.key, k)" class="px-3 py-2 text-sm text-[#ccc] hover:bg-[#4db6ac] hover:text-white cursor-pointer border-b border-[#33333d] last:border-0">
                                {{ k }}
                            </li>
                        </ul>
                    </div>
                    
                    <div v-if="parts[conf.key].isOpen" @click="parts[conf.key].isOpen = false" class="fixed inset-0 z-10"></div>
    
                    <div class="flex-grow text-sm leading-relaxed bg-[#2a2a35]/60 p-3 rounded border border-[#444452]/50 min-h-[100px]">
                        <!-- 顯示全域搜尋結果（優先覆蓋） -->
                        <div v-if="globalSearch && globalMatchedResults(conf.key).length > 0">
                            <div v-for="(res, idx) in globalMatchedResults(conf.key)" :key="idx" class="mb-3 last:mb-0">
                                <div class="text-[#4db6ac] text-[11px] font-bold tracking-tighter opacity-80 mb-1">
                                    【{{ res.key }}】
                                </div>
                                <!-- 裝備名稱渲染為可點擊超連結 -->
                                <div class="text-[13px] border-l-2 border-[#4db6ac]/30 pl-2"
                                     v-html="buildItemLinks(res.value)">
                                </div>
                            </div>
                        </div>
                        <!-- 顯示已選詞條，裝備名稱渲染為可點擊超連結 -->
                        <div v-else-if="!globalSearch && parts[conf.key].selectedKey"
                             class="font-bold"
                             v-html="buildItemLinks(parts[conf.key].options[parts[conf.key].selectedKey],conf.label)">
                        </div>
                        <!-- 找不到對應項 -->
                        <span v-else class="text-[#777888] italic">
                            {{ globalSearch ? '無符合項' : 'Empty' }}
                        </span>
                    </div>
                </div>
            </div>

            <footer class="mt-16 py-6 text-center border-t border-[#444452]">
                <div class="flex flex-col items-center gap-2">
                    <a href="https://github.com/dsa83171/FFXIV-Fashion-check-Tool/issues" 
                       target="_blank"
                       class="text-[#4db6ac] hover:text-[#4db6ac]/80 text-[14px] font-bold flex items-center gap-2">
                       <span>🐛</span> Bug or 詞條資料回報
                    </a>
                    <p class="ml-4 text-[#777888] text-[12px] tracking-widest font-mono">
                        Credit: <a href="https://cycleapple.github.io/xiv-tc-toolbox/">cycleapple</a>
                    </p>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
